[package]
name = "factories_actor"
version = "0.1.0"
edition = "2024"

[features]
full-runtime = [
    "tokio-answer",
    "tokio-runtime",
    "tokio-lock",
    "dynamic-dispatch",
]

# This is pretty lightweight, only pulls in tokio sync and not the runtime
tokio-answer = ["dep:tokio", "tokio/sync"]

# Lock strategies backed by tokio's async sync primitives (no runtime needed)
tokio-lock = ["dep:tokio", "tokio/sync"]
# The default actor channel and task spawner (tokio mpsc mailbox + tokio rt).
# Implies `std`: tokio needs std anyway, and with it panics are captured.
tokio-runtime = ["dep:tokio", "tokio/rt", "tokio/sync", "std"]

# Capture handler/hook panics with `catch_unwind`: a panicking actor still runs
# its stop hook and records a `Panicked` outcome observable by watchers.
# Without this (or under `panic = "abort"`) a panic unwinds the actor task and
# lands on the `Aborted` drop-guard path, exactly as before.
# Also switches internal locking from the global critical section to
# per-object std mutexes (see `factories_sync`).
std = ["futures/std", "factories_sync/std"]
tracing = ["dep:tracing"]
# Additionally stamp `otel.*` convention fields (otel.name, otel.kind) on the
# framework's spans so `tracing-opentelemetry` exports them with meaningful
# operation names + span kinds. Pure field emission - pulls in no new crate.
opentelemetry = ["tracing"]

# Global dynamic-dispatch registry: handlers registered at binary load via
# link-section constructors (factories_collect).
dynamic-dispatch = ["dep:factories_collect"]

# `#[derive(Actor)]` and friends.
derive = ["dep:factories_actor_macro"]

# Append-only capture/audit log of actor spawns, deaths, and message edges.
# Uses a thread-local for the loop-scoped sender context, so it pulls `std` (the
# same way `tracing`'s `Span::current()` does); the dependency-free no_std core is
# unaffected when this is off.
capture = []

[dependencies]
tokio = { workspace = true, optional = true, default-features = false }
futures = { workspace = true, features = ["alloc"] }
tracing = { workspace = true, optional = true }
pin-project = { workspace = true }
paste = { workspace = true }
factories_rtti = { workspace = true }
factories_sync = { workspace = true }
factories_extension = { workspace = true }
factories_collect = { workspace = true, optional = true }
factories_actor_macro = { workspace = true, optional = true }
seq-macro = { workspace = true }
typed-builder = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing-subscriber = { workspace = true, features = ["std", "registry"] }
paste = { workspace = true }

# Tests run on std targets; provide the critical-section implementation that
# `factories_sync`'s default backend expects the final binary to supply (test
# runs without the `std` feature use that backend).
critical-section = { version = "1", features = ["std"] }
