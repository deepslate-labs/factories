[package]
name = "factories_actor"
version = "0.1.0"
edition = "2024"

[features]
full-runtime = ["kanal-runtime", "tokio-answer", "tokio-runtime"]

# This is pretty lightweight, only pulls in tokio sync and not the runtime
tokio-answer = ["dep:tokio", "tokio/sync"]
kanal-runtime = ["dep:kanal", "kanal/async"]
tokio-runtime = ["dep:tokio", "tokio/rt", "tokio/sync"]
tracing = ["dep:tracing"]

[dependencies]
kanal = { workspace = true, optional = true, default-features = false }
tokio = { workspace = true, optional = true, default-features = false }
futures = { workspace = true, features = ["alloc"] }
tracing = { workspace = true, optional = true }
pin-project = { workspace = true }
once_cell = { workspace = true, features = ["critical-section"] }

paste = { workspace = true }
factories_rtti = { workspace = true }
seq-macro = { workspace = true }
typed-builder = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
paste = { workspace = true }

# Tests run on std targets; provide the critical-section implementation that the
# no_std once_cell configuration expects the final binary to supply.
critical-section = { version = "1", features = ["std"] }
