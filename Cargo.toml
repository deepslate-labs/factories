[workspace]
members = [
    "crates/factories",
    "crates/factories_actor",
    "crates/factories_actor_macro",
    "crates/factories_benchmarks",
    "crates/factories_capture_codec",
    "crates/factories_capture_sink",
    "crates/factories_collect",
    "crates/factories_rtti",
    "crates/factories_types_macro"
]
resolver = "3"

[workspace.dependencies]
# Async RT
tokio = { version = "1.52.0", default-features = false }
pin-project = "1.1.11"
futures = { version = "0.3.32", default-features = false }

# Utilities (mostly for non-std replacements)
once_cell = { version = "1.21.4", default-features = false }
critical-section = { version = "1.2.0", default-features = false }

# Observability
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.20", default-features = false }

# Macro utilities
paste = "1.0.15"
proc-macro2 = "1.0.106"
proc-macro-error = "1.0.4"
quote = "1.0.45"
syn = "2.0.117"
typed-builder = "0.23.2"
seq-macro = "0.3.6"

# Error handling
thiserror = { version = "2.0.18", default-features = false }

# Own crates
factories = { path = "crates/factories" }
factories_actor = { path = "crates/factories_actor" }
factories_actor_macro = { path = "crates/factories_actor_macro" }
factories_capture_codec = { path = "crates/factories_capture_codec" }
factories_capture_sink = { path = "crates/factories_capture_sink" }
factories_collect = { path = "crates/factories_collect" }
factories_mem = { path = "crates/factories_mem" }
factories_rtti = { path = "crates/factories_rtti" }
factories_types_macro = { path = "crates/factories_types_macro" }
